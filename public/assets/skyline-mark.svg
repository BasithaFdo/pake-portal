<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#030610"/>
    </linearGradient>

    <!-- Neon Cyan to Violet Primary Gradient -->
    <linearGradient id="skCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Hot Orange-Red Skyline GT-R Taillight Gradient -->
    <linearGradient id="gtrRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff0033"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Hexagonal Shield Base -->
  <polygon points="64,6 116,28 116,92 64,122 12,92 12,28" 
           fill="url(#skBg)" 
           stroke="rgba(56, 189, 248, 0.25)" 
           stroke-width="2.5" />

  <!-- Inner Cyber Hexagonal Accent Stroke -->
  <polygon points="64,12 110,32 110,88 64,116 18,88 18,32" 
           fill="none" 
           stroke="url(#skCyanPurple)" 
           stroke-width="1.8" 
           opacity="0.85" />

  <!-- Background Tech Grid / Circuit Matrix Lines -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1">
    <line x1="28" y1="64" x2="100" y2="64"/>
    <line x1="64" y1="26" x2="64" y2="102"/>
    <circle cx="64" cy="64" r="32" fill="none" stroke-dasharray="2,3"/>
  </g>

  <!-- Dual R34 GT-R Iconic Twin Turbo / Taillight Rings (Glowing Cyber Motif) -->
  <g filter="url(#coreGlow)">
    <!-- Left Ring -->
    <circle cx="44" cy="46" r="14" fill="none" stroke="#00f5ff" stroke-width="2.8" opacity="0.9"/>
    <circle cx="44" cy="46" r="7" fill="rgba(0, 245, 255, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="44" cy="46" r="2.5" fill="#ffffff"/>

    <!-- Right Ring -->
    <circle cx="84" cy="46" r="14" fill="none" stroke="#d946ef" stroke-width="2.8" opacity="0.9"/>
    <circle cx="84" cy="46" r="7" fill="rgba(217, 70, 239, 0.15)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="84" cy="46" r="2.5" fill="#ffffff"/>
  </g>

  <!-- High-Velocity Aerodynamic 'S' Blade & Skyline Hub Spine -->
  <path d="M 88 30 
           L 46 30 
           C 34 30, 28 38, 32 50 
           C 36 62, 54 62, 64 64 
           C 78 66, 96 68, 96 82 
           C 96 98, 78 98, 64 98 
           L 36 98" 
        fill="none" 
        stroke="url(#skCyanPurple)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Sharp Inner Speed Slash (High-precision White Core) -->
  <path d="M 82 30 
           L 50 30 
           C 40 30, 36 37, 39 46 
           C 43 56, 58 58, 67 60 
           C 78 62, 90 65, 90 76 
           C 90 88, 76 90, 64 90 
           L 44 90" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.95" />

  <!-- Lower Tech Interconnect Nodes -->
  <g fill="url(#skCyanPurple)">
    <circle cx="64" cy="108" r="3.5" filter="url(#coreGlow)"/>
    <line x1="64" y1="98" x2="64" y2="108" stroke="#00f5ff" stroke-width="2"/>
    <circle cx="40" cy="103" r="2" opacity="0.7"/>
    <circle cx="88" cy="103" r="2" opacity="0.7"/>
  </g>
</svg>
